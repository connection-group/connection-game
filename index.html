<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CONNECTION | משחק ההשקעות</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Montserrat:wght@800;900&display=swap"><style>/* CONNECTION design tokens — מקור: ספר המותג. גופנים: להניח קבצים ב-assets/fonts */
/* גופנים קרובים לספר המותג (עד לקבלת הגופנים הרשמיים): Heebo לעברית, Montserrat לאנגלית/ציטוטים */
:root{--orange:#F0552A;--black:#21110B;--beige:#F7EFEA;--white:#fff;--r:20px;--tint:rgba(33,17,11,.12);--en:Montserrat,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:Heebo,Arial,sans-serif;color:var(--black);background:var(--beige);font-size:17px;line-height:1.5;min-height:100vh;transition:background .4s}
body.orange{background:var(--orange);color:var(--white)}
h1,h2,h3{font-weight:900;line-height:1.08}
h1{font-size:clamp(34px,9vw,48px)}h2{font-size:clamp(26px,6.5vw,32px)}
.dots{border-bottom:3px dotted currentColor;margin:14px 0 18px;width:100%}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:var(--r);background:var(--orange);color:var(--white);font:700 20px/1.2 Heebo,Arial,sans-serif;cursor:pointer;padding:16px;transition:transform .15s}
.btn:active{transform:scale(.98)}.btn.dark{background:var(--black)}.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--white);border-radius:var(--r);padding:18px}
:focus-visible{outline:3px solid var(--black);outline-offset:3px}
body.orange :focus-visible{outline-color:var(--white)}
.lg{height:44px;width:auto;display:block;margin:0 0 6px auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.orange{background-color:var(--orange);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .13 0 0 0 0 .07 0 0 0 0 .04 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style>
<style>
#app{max-width:480px;margin:auto;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr{flex:1;display:flex;flex-direction:column;gap:6px;padding:max(20px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));position:relative;z-index:1;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center}
.mid p{font-size:20px;font-weight:700}
.ct{position:absolute;inset:auto 0 0 0;width:100%;height:42%;z-index:0;pointer-events:none}
.ct path{fill:none;stroke:var(--orange);stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s ease forwards}
body.orange .ct path{stroke:rgba(255,255,255,.5)}
@keyframes draw{to{stroke-dashoffset:0}}
.pg{display:flex;gap:6px;margin:16px 0 22px}.pg i{flex:1;height:5px;border-radius:3px;background:var(--tint)}.pg i.on{background:var(--orange)}
.opts{display:grid;gap:12px}
.opt{min-height:60px;border:2px solid var(--black);border-radius:var(--r);background:var(--white);color:var(--black);font:700 20px/1.2 Heebo,Arial,sans-serif;padding:14px 18px;text-align:right;cursor:pointer;transition:.15s}
.opt:active,.opt.sel{background:var(--orange);border-color:var(--orange);color:var(--white)}
.res{margin:12px 0;animation:in .5s ease both}.res h3{font-size:20px;margin-bottom:10px}
.bar{height:10px;background:var(--tint);border-radius:9px;overflow:hidden}
.bar b{display:block;height:100%;width:var(--w);background:var(--black);border-radius:9px;transform-origin:right;animation:grow 1.2s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.fin{font-size:32px;font-weight:900;margin:10px 0 6px}
dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}dt{font-size:13px;opacity:.75}dd{font-weight:700}
small{display:block;font-size:13px;opacity:.8;margin-top:8px}
.note{background:var(--white);border-radius:var(--r);padding:14px 16px;font-weight:700;margin-bottom:6px}
.note b{color:var(--orange)}
label{font-weight:700;display:block;margin:14px 0 6px}
input[type=text],input[type=tel],input[type=email]{width:100%;min-height:56px;border:2px solid var(--black);border-radius:var(--r);padding:0 16px;font:400 18px Heebo,Arial,sans-serif;background:var(--white);color:var(--black)}
input::placeholder{color:rgba(33,17,11,.45)}
.chk{display:flex;gap:12px;align-items:flex-start;margin:18px 0;font-size:15px}.chk input{width:24px;height:24px;accent-color:var(--orange);flex:none}
.err{color:var(--black);font-weight:700;min-height:24px}
.net{position:absolute;inset:0 0 auto 0;width:100%;height:auto;z-index:0;pointer-events:none}.nd{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.5);opacity:.3}}
.q{font:900 22px/1.15 var(--en);letter-spacing:.01em;margin:18px 0 6px}.q small{font:700 13px var(--en);margin-top:8px;opacity:1}
.bolt{width:90px;transform:rotate(-40deg);align-self:flex-start;margin:10px 0}
/* מסך ההזדמנות */
.opp{display:grid;gap:12px;margin:4px 0 14px}
.opp .card{animation:in .5s ease both}.opp .card:nth-child(2){animation-delay:.15s}.opp .card:nth-child(3){animation-delay:.3s}
.big{font-size:clamp(40px,11vw,54px);font-weight:900;line-height:1;color:var(--orange);margin:4px 0 8px;letter-spacing:-.01em}
.sub{font-size:15px;line-height:1.45}
.tag{display:inline-block;background:var(--orange);color:var(--white);border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px;margin-bottom:10px}
.presale{background:var(--black);color:var(--white)}.presale h3{font-size:22px;margin-bottom:8px}
.date{font-weight:700;font-size:17px}.date b{color:var(--orange);font-size:24px;font-weight:900;margin-right:4px}
.lead{font-size:19px;font-weight:700}
.hint{font-size:14px;opacity:.75;margin-top:-2px}
/* סליידר הון עצמי */
.amt{font-size:clamp(40px,12vw,56px);font-weight:900;color:var(--orange);text-align:center;margin:10px 0 6px;letter-spacing:-.01em}
.rng{width:100%;-webkit-appearance:none;appearance:none;height:10px;border-radius:9px;background:var(--tint);outline:none;margin:14px 0 6px;direction:ltr}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:var(--orange);border:4px solid var(--white);box-shadow:0 2px 8px rgba(33,17,11,.25);cursor:pointer}
.rng::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:var(--orange);border:4px solid var(--white);box-shadow:0 2px 8px rgba(33,17,11,.25);cursor:pointer}
.rng:focus-visible{outline:3px solid var(--black);outline-offset:4px}
.lim{display:flex;justify-content:space-between;font-size:13px;opacity:.7;margin-bottom:22px}
/* תוצאת קרקע */
.res.land{background:var(--white);color:var(--black);border:2px solid var(--orange)}
.land .bar{background:var(--tint)}.land .bar b{background:var(--orange)}.land .fin{color:var(--orange)}
/* קופתקרקע */
.kk{display:grid;gap:12px;margin:4px 0 14px}
.kk .card{animation:in .5s ease both}.kk .card:nth-child(2){animation-delay:.15s}.kk .card:nth-child(3){animation-delay:.3s}
.kk h3{font-size:20px;margin-bottom:8px}.kk p{font-size:15px;line-height:1.5}
.kk ul{margin:0;padding:0 18px 0 0;font-size:15px;line-height:1.5}.kk li{margin:4px 0}
.kk .card.dark{background:var(--black);color:var(--white)}.kk .card.dark b{color:var(--orange)}
.kk .quote{font-size:17px;font-weight:700;text-align:center;margin:6px 0}
</style></head><body><main id="app"></main>

const NET=`<svg class="net" viewBox="0 0 400 280" preserveAspectRatio="xMaxYMin meet" aria-hidden="true"><g fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.3"><circle cx="290" cy="120" r="105"/><circle cx="110" cy="180" r="80"/><circle cx="380" cy="30" r="60"/><circle class="nd" cx="195" cy="60" r="15"/><circle class="nd" cx="330" cy="205" r="11" style="animation-delay:.6s"/><circle class="nd" cx="50" cy="110" r="9" style="animation-delay:1.2s"/></g><g fill="#fff"><circle cx="195" cy="60" r="5"/><circle cx="330" cy="205" r="4"/><circle cx="50" cy="110" r="3"/><circle cx="262" cy="22" r="6"/><circle cx="190" cy="255" r="4"/></g></svg>`;
const prog=(i,n=4)=>`<div class="pg">${Array.from({length:n},(_,j)=>`<i class="${j<i?"on":""}"></i>`).join("")}</div>`;
function show(html,tone,step,ct=1){document.body.className=tone;app.innerHTML=`<section class="scr">${html}</section>${ct?CT:""}`;scrollTo(0,0);track(step)}
function open(){show(`${NET}${logo(1)}<div class="mid"><h1>כמה יכול לצמוח ההון שלכם?</h1><div class="dots"></div><p>חמישה אפיקים, שלוש נקודות זמן ותשובה אחת שמפתיעה.</p></div><button class="btn dark" id="go">מתחילים</button>`,"orange","open");$("#go").onclick=capital}
function ask(i,step,title,opts,fmt,cb,n=4,extra=""){show(`${logo(0)}${prog(i,n)}<h2>${title}</h2><div class="dots"></div>${extra}<div class="opts">${opts.map((o,j)=>`<button class="opt" data-j="${j}">${fmt(o)}</button>`).join("")}</div>`,"beige",step);
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{b.classList.add("sel");setTimeout(()=>cb(opts[b.dataset.j]),220)})}
function capital(){const v0=S.cap||CAP.start;show(`${logo(0)}${prog(1)}<h2>כמה הון עצמי תרצו להשקיע?</h2><div class="dots"></div><p class="hint">גררו את הסליידר ועצרו על הסכום שמתאים לכם.</p><div class="amt" id="amt">${ils(v0)}</div><input class="rng" id="rng" type="range" min="${CAP.min}" max="${CAP.max}" step="${CAP.step}" value="${v0}" aria-label="הון עצמי להשקעה"><div class="lim"><span>${ils(CAP.min)}</span><span>${ils(CAP.max)}+</span></div><button class="btn" id="s">ממשיכים</button>`,"beige","capital");
 const r=$("#rng"),a=$("#amt");r.oninput=()=>a.textContent=ils(+r.value);$("#s").onclick=()=>{S.cap=+r.value;goal()}}
const goal=()=>ask(2,"goal","מה מטרת ההשקעה?",GOALS,x=>x,v=>{S.goal=v;horizon()});
const horizon=()=>ask(3,"horizon","לכמה זמן?",YRS,y=>y+" שנים",v=>{S.y=v;guess()});
const guess=()=>ask(4,"guess",`לדעתכם, איזה אפיק ישיג את התשואה הגבוהה ביותר בעוד ${S.y} שנים?`,V,v=>v.n,v=>{S.guess=v.n;results()});
function results(){const {cap,y}=S,rows=V.map(v=>{const m=mult(v.k,y);return{...v,m,fin:cap*m}}),land=rows.find(r=>r.k==="land");
 const hit=S.guess===land.n;
 const cards=[land,...rows.filter(r=>r.k!=="land")].map(r=>{const L=r.k==="land";return`<article class="card res ${L?"land":""}"><h3>${r.t||r.n}</h3><div class="bar"><b style="--w:${r.fin/land.fin*100}%"></b></div><div class="fin" data-to="${r.fin}">${ils(r.fin)}</div><dl><div><dt>רווח</dt><dd>${ils(r.fin-cap)}</dd></div><div><dt>${L?"פוטנציאל תשואה מצטברת":"תשואה מצטברת"}</dt><dd>${pc(r.m-1)}</dd></div>${L?"":`<div><dt>תשואה שנתית</dt><dd>${pc(CFG.rates[r.k])}</dd></div>`}</dl><small>${r.src}</small>${L&&y==6&&CFG.est6?"<small>* נקודת הביניים לשש שנים משוערת, וטרם אומתה מול נתוני העסקאות.</small>":""}</article>`}).join("");
 show(`${logo(0)}<h2 style="margin-top:18px">${ils(cap)} אחרי ${y} שנים</h2><div class="dots"></div><div class="note">${hit?"<b>ניחוש נכון.</b> קרקע פרטית הובילה.":`<b>טעיתם.</b> צפו בתוצאות וגלו את התשובה הנכונה.`}</div>${cards}<button class="btn" id="cta">רגע, יש עוד משהו שכדאי לדעת 👀</button><small style="margin-top:14px">${DISC}</small>`,"beige","results",0);
 if(!matchMedia("(prefers-reduced-motion:reduce)").matches)app.querySelectorAll("[data-to]").forEach(el=>{const to=+el.dataset.to,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1200);el.textContent=ils(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)});
 $("#cta").onclick=opportunity}
function opportunity(){show(`${logo(0)}<h2 style="margin-top:18px">הכירו את קופתקרקע מבית CONNECTION</h2><div class="dots"></div>
<p class="lead">הזדמנות להשקיע בקרקע פרטית במרכז הארץ, החל מ־50,000 ₪ הון עצמי.</p>
<div class="kk">
<article class="card"><p>מסלול קופתקרקע מאפשר לכם להיכנס להשקעה במתחם החלוצים ברחובות, עם פוטנציאל השבחה משמעותי לאורך השנים, באמצעות שילוב של הון עצמי ומימון בנקאי בתנאים ייעודיים, במסגרת שיתוף הפעולה עם <b style="color:var(--orange)">בנק מזרחי טפחות</b>.</p></article>
<article class="card"><h3>מה מחכה לכם במסלול?</h3><ul><li>קרקע פרטית הרשומה על שמכם בטאבו.</li><li>הון עצמי התחלתי החל מ־50,000 ₪.</li><li>אפשרות למימון בנקאי בתנאים ייעודיים, בכפוף לאישור הבנק.</li><li>ליווי מקצועי של קבוצת CONNECTION לאורך הדרך מהרכישה ועד שלב המימוש.</li></ul></article>
<article class="card dark"><span class="tag">PRESALE</span><h3>הטבת PRESALE מיוחדת למשתתפי הכנס "כלכלה בגובה העיניים"</h3><div class="date">בתוקף עד <b>10.12.2026</b></div></article>
</div>
<p class="quote">ההון שלכם היום הוא הפוטנציאל של העתיד הכלכלי שלכם.</p>
<p class="lead" style="margin-bottom:12px">השאירו פרטים ובואו לגלות מה הכסף שלכם יכול לעשות עבורכם.</p>
<button class="btn" id="go">אני רוצה להכיר את ההזדמנות</button>`,"beige","opportunity",0);$("#go").onclick=form1}
function form1(){show(`${logo(0)}${prog(1,3)}<h2>נעים להכיר</h2><div class="dots"></div><p>הסכום, המטרה והאופק שבחרתם כבר אצלנו. נשארו רק הפרטים שלכם.</p>
<label for="n">שם מלא</label><input id="n" type="text" autocomplete="name" value="${esc(S.name||"")}">
<label for="p">מספר טלפון</label><input id="p" type="tel" autocomplete="tel" inputmode="tel" dir="ltr" style="text-align:right" value="${esc(S.phone||"")}">
<label for="m">כתובת מייל</label><input id="m" type="email" autocomplete="email" inputmode="email" dir="ltr" style="text-align:right" value="${esc(S.email||"")}">
<div class="err" id="e" role="alert"></div><button class="btn" id="s">ממשיכים</button>`,"beige","form1",0);
 $("#s").onclick=()=>{const n=$("#n").value.trim(),p=$("#p").value.replace(/[\s-]/g,""),m=$("#m").value.trim(),e=$("#e");
  if(n.length<2)return e.textContent="נא למלא שם מלא";
  if(!/^(0\d{8,9}|\+?972\d{8,9})$/.test(p))return e.textContent="נא להזין מספר טלפון תקין";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m))return e.textContent="נא להזין כתובת מייל תקינה";
  S.name=n;S.phone=p;S.email=m;form2()}}
const form2=()=>ask(2,"form2",`${esc((S.name||"").split(" ")[0])}, מה היית רוצה להשיג באמצעות ההשקעה?`,WANTS,x=>x,v=>{S.want=v;form3()},3);
function form3(){show(`${logo(0)}${prog(3,3)}<h2>מתי יהיה לך נוח להגיע אלינו לפגישה?</h2><div class="dots"></div><p class="hint">לא צריך תאריך מדויק. ימים ושעות באופן כללי מספיקים.</p>
<label for="a">זמינות לפגישה</label><input id="a" type="text" placeholder="למשל: ראשון או שלישי, בשעות אחר הצהריים" value="${esc(S.avail||"")}">
<div class="chk"><input id="c" type="checkbox"><label for="c" style="margin:0;font-weight:400">${CONSENT}</label></div><div class="err" id="e" role="alert"></div><button class="btn" id="s">לגלות מה הכסף שלי יכול לעשות</button>`,"beige","form3",0);
 $("#s").onclick=()=>{const a=$("#a").value.trim(),e=$("#e");
  if(a.length<2)return e.textContent="נא לציין מתי נוח לך להגיע";
  if(!$("#c").checked)return e.textContent="נדרש אישור ליצירת קשר";
  S.avail=a;$("#s").disabled=true;
  send({ev:"lead",name:S.name,phone:S.phone,email:S.email,consent:true,cap:S.cap,goal:S.goal,y:S.y,guess:S.guess,want:S.want,avail:S.avail,presale:true});
  track("submitted");if(/^http/.test(CFG.booklet)){setTimeout(()=>location.href=CFG.booklet,350)}else done(S.name.split(" ")[0])}}
function done(f){show(`${NET}${logo(1)}<div class="mid"><img class="bolt" src="${img('nn-white')}" alt=""><h1>תודה, ${esc(f)}.</h1><div class="dots"></div><p>הפרטים התקבלו. נציג מטעמנו יחזור אליך בקרוב להמשך תיאום הפגישה.</p></div><div class="q" dir="ltr">SUCCEEDING IN BUSINESS<br>IS ABOUT MAKING<br>CONNECTIONS<small>RICHARD BRANSON</small></div>`,"orange","done",0)}
open();
</script></body></html>
